name: probe-win-locks-test

on:
  push:
    branches: [probe/win-locks-test]

jobs:
  probe:
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc
          prefix-key: v1-rust-gpui
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target
      - name: Run setup
        shell: bash
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
      - name: Prepare GPUI dependency
        shell: bash
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - name: Probe tests
        shell: bash
        run: |
          export PATH="$(cygpath "$GITHUB_WORKSPACE/target/debug"):$PATH"
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --target x86_64-pc-windows-msvc --bin cap-gpui deleting_from_the_editor -- --nocapture --test-threads=1 2>&1 | grep -vE "^\s*(Compiling|Downloaded|Checking|Fresh)"
